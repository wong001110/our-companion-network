name: Minimize Social Schema Diff

on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - '.github/agent/minimize-social-schema-diff.py'
      - '.github/workflows/minimize-social-schema-diff.yml'

permissions:
  contents: write

jobs:
  minimize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: our_companion_network_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/our_companion_network_schema?schema=public
      PG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/our_companion_network_schema
      JWT_SECRET: social-schema-access-secret-32
      JWT_REFRESH_SECRET: social-schema-refresh-secret-32
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore main formatting and retain only Social additions
        run: python .github/agent/minimize-social-schema-diff.py
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Validate migration and schema alignment
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/main-schema.prisma
          npx prisma db push --schema /tmp/main-schema.prisma --skip-generate
          psql "$PG_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260725120000_social_visit_mvp/migration.sql
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Commit minimal reviewed schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: minimize social visit schema diff"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
