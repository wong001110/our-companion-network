name: Apply Joinable Social Rooms

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/joinable-social-rooms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/joinable-social-rooms
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix portal ci
      - run: python scripts/apply-joinable-social-rooms.py
      - run: npx prisma format
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run portal:typecheck
      - run: npm run portal:lint
      - run: npm run portal:test -- --run
      - run: npm run portal:build
      - name: Remove integration scaffolding
        run: rm .github/workflows/apply-joinable-social-rooms.yml scripts/apply-joinable-social-rooms.py
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: list joinable friend Social Rooms"
          git push origin HEAD:agent/joinable-social-rooms
