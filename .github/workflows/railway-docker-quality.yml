name: Railway Docker Quality

on:
  pull_request:
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.portal'
      - '.dockerignore'
      - 'deploy/railway/**'
      - 'scripts/railway-migrate.mjs'
      - 'scripts/railway-migrate.test.mjs'
      - 'scripts/railway-dockerfile.test.mjs'
      - 'scripts/railway-caddyfile.test.mjs'
      - 'src/main.ts'
      - 'prisma/**'
      - 'portal/**'
      - 'docs/RAILWAY_DOCKER_DEPLOYMENT.md'
      - '.github/workflows/railway-docker-quality.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.portal'
      - '.dockerignore'
      - 'deploy/railway/**'
      - 'scripts/railway-migrate.mjs'
      - 'scripts/railway-migrate.test.mjs'
      - 'scripts/railway-dockerfile.test.mjs'
      - 'scripts/railway-caddyfile.test.mjs'
      - 'src/main.ts'
      - 'prisma/**'
      - 'portal/**'

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: railway_deployment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railway_deployment_test?schema=public
      JWT_SECRET: railway-api-quality-access-secret-32
      JWT_REFRESH_SECRET: railway-api-quality-refresh-secret-32
      PORTAL_ORIGINS: http://localhost:4173
      PORTAL_COOKIE_SECURE: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --test scripts/railway-migrate.test.mjs scripts/railway-dockerfile.test.mjs scripts/railway-caddyfile.test.mjs
      - name: Bootstrap an empty database
        run: node scripts/railway-migrate.mjs
      - name: Verify migration bootstrap is idempotent
        run: node scripts/railway-migrate.mjs
      - run: npm run lint
      - name: Require lint to leave a clean tree
        run: git diff --exit-code
      - run: npm run build
      - name: Verify initial Caretaker setup is idempotent
        env:
          NODE_ENV: production
          INITIAL_SUPERADMIN_EMAIL: railway-caretaker@example.test
          INITIAL_SUPERADMIN_USERNAME: railway-caretaker
          INITIAL_SUPERADMIN_PASSWORD: railway-quality-password-123
          INITIAL_SUPERADMIN_RESET_PASSWORD: 'false'
        run: |
          node dist/src/admin/initial-superadmin.cli.js
          node dist/src/admin/initial-superadmin.cli.js
      - run: npm test -- --runInBand
      - name: Smoke API health endpoint
        run: |
          PORT=3001 npm run start:prod > api-smoke.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true; cat api-smoke.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/meta/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Build API Docker image
        id: api_docker_build
        continue-on-error: true
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build --progress=plain --file Dockerfile.api --tag our-companion-network-api:ci . > api-docker-build.log 2>&1
      - name: Upload API Docker diagnostics
        if: steps.api_docker_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: railway-api-docker-diagnostics
          path: api-docker-build.log
      - name: Fail on API Docker build error
        if: steps.api_docker_build.outcome == 'failure'
        run: tail -n 200 api-docker-build.log && exit 1
      - name: Verify compiled API entrypoints inside image
        if: steps.api_docker_build.outcome == 'success'
        run: |
          docker run --rm --entrypoint sh our-companion-network-api:ci -c \
            'test -f /app/dist/main.js && test -f /app/dist/admin/initial-superadmin.cli.js'
      - name: Verify Prisma engine inside API image
        if: steps.api_docker_build.outcome == 'success'
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            --env DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/railway_deployment_test?schema=public \
            our-companion-network-api:ci \
            node scripts/railway-migrate.mjs
      - name: Smoke production API container entrypoint
        if: steps.api_docker_build.outcome == 'success'
        run: |
          docker run --detach --name api-container-smoke --publish 18081:3001 \
            --add-host=host.docker.internal:host-gateway \
            --env PORT=3001 \
            --env NODE_ENV=production \
            --env DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/railway_deployment_test?schema=public \
            --env JWT_SECRET=railway-api-quality-access-secret-32 \
            --env JWT_REFRESH_SECRET=railway-api-quality-refresh-secret-32 \
            --env PORTAL_ORIGINS=http://localhost:4173 \
            --env PORTAL_COOKIE_SECURE=false \
            our-companion-network-api:ci
          trap 'docker logs api-container-smoke || true; docker rm --force api-container-smoke || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/api/meta/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --prefix portal
      - name: Portal typecheck
        id: portal_typecheck
        continue-on-error: true
        run: npm run portal:typecheck > portal-typecheck.log 2>&1
      - name: Upload Portal typecheck diagnostics
        if: steps.portal_typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: railway-portal-typecheck-diagnostics
          path: portal-typecheck.log
      - name: Fail on Portal typecheck error
        if: steps.portal_typecheck.outcome == 'failure'
        run: cat portal-typecheck.log && exit 1
      - name: Portal lint
        run: npm run portal:lint
      - name: Portal tests
        run: npm run portal:test
      - name: Portal production build
        run: npm run portal:build
      - name: Build Portal Docker image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build --file Dockerfile.portal --tag our-companion-network-portal:ci .
      - name: Smoke Portal container, API proxy and SPA fallback
        run: |
          cat > /tmp/mock-portal-api.mjs <<'NODE'
          import http from 'node:http';

          const server = http.createServer((request, response) => {
            const chunks = [];
            request.on('data', (chunk) => chunks.push(chunk));
            request.on('end', () => {
              if (request.method === 'POST' && request.url === '/api/test-login') {
                response.writeHead(200, { 'content-type': 'application/json' });
                response.end(JSON.stringify({
                  ok: true,
                  method: request.method,
                  path: request.url,
                  body: Buffer.concat(chunks).toString('utf8'),
                }));
                return;
              }

              response.writeHead(404, { 'content-type': 'text/plain' });
              response.end('not found');
            });
          });

          server.listen(19001, '0.0.0.0');
          NODE

          node /tmp/mock-portal-api.mjs > mock-portal-api.log 2>&1 &
          MOCK_API_PID=$!

          docker run --detach --name portal-smoke --publish 18080:8080 \
            --add-host=host.docker.internal:host-gateway \
            --env PORT=8080 \
            --env API_ORIGIN=http://host.docker.internal:19001 \
            our-companion-network-portal:ci

          trap 'kill $MOCK_API_PID || true; cat mock-portal-api.log || true; docker logs portal-smoke || true; docker rm --force portal-smoke || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep --quiet ok; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/login | grep --quiet '<div id="root"></div>'

          PROXY_RESPONSE="$(curl --fail --silent \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"email":"caretaker@example.test","password":"test-password"}' \
            http://127.0.0.1:18080/api/test-login)"

          printf '%s' "$PROXY_RESPONSE" | grep --quiet '"ok":true'
          printf '%s' "$PROXY_RESPONSE" | grep --quiet '"method":"POST"'
          printf '%s' "$PROXY_RESPONSE" | grep --quiet '"path":"/api/test-login"'
