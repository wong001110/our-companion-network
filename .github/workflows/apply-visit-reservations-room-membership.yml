name: Apply Visit Reservations Room Membership

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/visit-reservations-social-room'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: our_companion_network_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/our_companion_network_test?schema=public
      JWT_SECRET: room-membership-access-secret-32
      JWT_REFRESH_SECRET: room-membership-refresh-secret-32
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visit-reservations-social-room
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix portal ci
      - run: python scripts/apply-visit-reservations-room-membership.py
      - run: python scripts/patch-visit-room-lint.py
      - run: python scripts/patch-visit-room-types.py
      - run: npx prisma format
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - name: Run API tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand > /tmp/api-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- concise Jest failure summary ---'
            grep -E -A24 -B5 'FAIL |Summary of all failing tests|TypeError:|Expected substring:|Expected:|Received:|Cannot read properties|● ' /tmp/api-tests.log | tail -n 500 || tail -n 500 /tmp/api-tests.log
            exit "$status"
          fi
          tail -n 80 /tmp/api-tests.log
      - run: npm run portal:typecheck
      - run: npm run portal:lint
      - run: npm run portal:test -- --run
      - run: npm run portal:build
      - name: Validate migration from main
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/main-schema.prisma
          npx prisma db push --schema /tmp/main-schema.prisma --skip-generate
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f prisma/migrations/20260731050000_visit_reservations_room_membership/migration.sql
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Remove one-time integration files
        run: |
          rm scripts/apply-visit-reservations-room-membership.py
          rm scripts/patch-visit-room-lint.py
          rm scripts/patch-visit-room-types.py
          rm .github/workflows/apply-visit-reservations-room-membership.yml
      - name: Commit integrated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add Visit reservations and room membership"
          git push origin HEAD:agent/visit-reservations-social-room
