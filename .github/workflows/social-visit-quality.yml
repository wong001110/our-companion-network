name: Social Visit Quality

on:
  pull_request:
    paths:
      - 'src/visit-social/**'
      - 'src/app.module.ts'
      - 'src/common/protocol-config.service.ts'
      - 'prisma/migrations/**'
      - 'docs/SOCIAL_VISIT_MVP_GAUNTLET.md'
      - '.github/workflows/social-visit-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/visit-social/**'
      - 'src/app.module.ts'
      - 'src/common/protocol-config.service.ts'
      - 'prisma/migrations/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: our_companion_network_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/our_companion_network_test?schema=public
      JWT_SECRET: social-visit-quality-access-secret-32
      JWT_REFRESH_SECRET: social-visit-quality-refresh-secret-32
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        id: migrate
        continue-on-error: true
        run: npx prisma migrate deploy > migration.log 2>&1
      - name: Upload migration diagnostics
        if: steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: social-visit-migration-diagnostics
          path: migration.log
      - name: Fail on migration error
        if: steps.migrate.outcome == 'failure'
        run: cat migration.log && exit 1
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
